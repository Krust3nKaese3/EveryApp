<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mehrspieler-Lobby</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 16px; background: #101218; color: #f2f4f8; }
    button, input { font: inherit; }
    input { padding: 10px; border-radius: 8px; border: 0; width: 100%; box-sizing: border-box; }
    button { margin: 8px 8px 0 0; padding: 12px 16px; border: 0; border-radius: 10px; background: #2f6fed; color: white; }
    button.quiet { background: transparent; color: #d5d8e0; }
    ul { padding-left: 18px; }
    .card { background: #1b1f2a; border-radius: 12px; padding: 12px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Lobby</h1>
  <label>Name<br /><input id="name" maxlength="24" value="Spieler" /></label>
  <label>Raumcode am PC<br /><input id="code" maxlength="200" placeholder="Leer lassen: Kamera in EveryApp" /></label>
  <div>
    <button id="host" type="button">Raum öffnen</button>
    <button id="discover" type="button">Spiele in der Nähe</button>
    <button id="join" type="button">Beitreten</button>
    <button id="leave" class="quiet" type="button">Verlassen</button>
  </div>
  <p id="status">Noch kein Raum.</p>
  <div class="card">
    <strong>In der Nähe</strong>
    <ul id="rooms"></ul>
  </div>
  <div class="card" id="ask">
    <p id="asktext"></p>
    <button id="allow" type="button">Zulassen</button>
    <button id="deny" type="button">Ablehnen</button>
  </div>
  <div class="card">
    <strong>Spieler</strong>
    <ul id="players"></ul>
  </div>
  <div class="card">
    <p id="round">Runde noch nicht gestartet.</p>
    <button id="start" type="button">Runde starten</button>
    <button id="plus" type="button">+1</button>
    <button id="yes" type="button">Ja</button>
    <button id="no" type="button">Nein</button>
  </div>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>

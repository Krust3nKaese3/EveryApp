plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.backgroundservice'
version = '0.1.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.backgroundservice"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
}
